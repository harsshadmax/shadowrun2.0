<div class="kpi">
  <span class="kpi-icon"><svg class="i" aria-hidden="true"><use href="#i-scan"/></svg></span>
  <div><span class="kpi-label">Total scans</span><span class="kpi-num">{{ k.total }}</span></div>
  <span class="kpi-sub">{% if k.total %}median {{ k.median|secs }}{% else %}no scans yet{% endif %}</span>
</div>
<div class="kpi">
  <span class="kpi-icon"><svg class="i" aria-hidden="true"><use href="#i-block"/></svg></span>
  <div><span class="kpi-label">Blocked</span><span class="kpi-num">{{ k.blocked }}</span></div>
  <span class="kpi-sub bad">{% if k.total %}{{ k.blocked_pct }}% of scans{% else %}-{% endif %}</span>
</div>
<div class="kpi">
  <span class="kpi-icon"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></span>
  <div><span class="kpi-label">Allowed</span><span class="kpi-num">{{ k.allowed }}</span></div>
  <span class="kpi-sub ok">{% if k.total %}{{ k.allowed_pct }}% of scans{% else %}-{% endif %}</span>
</div>
