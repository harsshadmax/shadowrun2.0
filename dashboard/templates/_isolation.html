<div class="card-head"><h2>Isolation</h2></div>
<svg class="iso" viewBox="0 0 320 132" role="img" aria-labelledby="iso-t iso-d">
  <title id="iso-t">Isolation layout</title>
  <desc id="iso-d">The agent's install goes through the gate into a sandbox that can reach only the sink. The internet is blocked.</desc>
  <g class="node"><rect x="2" y="22" width="62" height="34" rx="9"/><text x="33" y="43" text-anchor="middle">Agent</text></g>
  <g class="node"><rect x="86" y="22" width="62" height="34" rx="9"/><text x="117" y="43" text-anchor="middle">Gate</text></g>
  <g class="node hot"><rect x="170" y="22" width="70" height="34" rx="9"/><text x="205" y="43" text-anchor="middle">Sandbox</text></g>
  <g class="node"><rect x="262" y="22" width="56" height="34" rx="9"/><text x="290" y="43" text-anchor="middle">Sink</text></g>
  <path class="edge" d="M64 39h22M148 39h22M240 39h22"/>
  <path class="edge dash" d="M205 56v36"/>
  <g class="node muted-node"><rect x="168" y="92" width="74" height="30" rx="9"/><text x="205" y="111" text-anchor="middle">Internet</text></g>
  <path class="cross" d="M199 68l12 12M211 68l-12 12"/>
</svg>
<ul class="checks">
  {% for label, c in items %}
  <li>
    <span>{{ label }}</span>
    {% if c is none %}<span class="chip neutral">unknown</span>
    {% elif c.ok %}<span class="chip ok" title="{{ c.detail }}">Pass</span>
    {% else %}<span class="chip bad" title="{{ c.detail }}">Fail</span>{% endif %}
  </li>
  {% endfor %}
</ul>
